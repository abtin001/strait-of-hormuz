<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#c0c0c0">
<title>تنگه هرمز | Strait of Hormuz</title>
<style>
:root{--win:#c0c0c0;--navy:#000080;--panel:#dfdfdf;--ink:#111;--green:#008000;--red:#b00020}
*{box-sizing:border-box}
body{margin:0;background:#008080;color:var(--ink);font-family:Tahoma,"MS Sans Serif",Arial,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:14px}
button,select{font:inherit;color:#111}
.app{width:min(100%,560px);background:var(--win);border:2px solid;border-color:#fff #404040 #404040 #fff;box-shadow:2px 2px 0 #111;padding:3px}
.titlebar{background:linear-gradient(90deg,#000080,#1084d0);color:#fff;padding:7px 9px;display:flex;align-items:center;justify-content:space-between;font-weight:bold;font-size:14px}
.titlebar small{font-weight:normal;font-size:11px}
.menubar{display:flex;gap:16px;padding:7px 8px;border-bottom:1px solid #888;font-size:12px}
.menubar button{background:none;border:0;padding:0;text-decoration:underline;cursor:pointer}
.main{padding:12px}
.hero{text-align:center;padding:7px 0 10px}
.hero .logo{font-size:36px;line-height:1.1;display:flex;align-items:center;justify-content:center;gap:12px}.hero .logo img{width:clamp(54px,17vw,86px);height:clamp(54px,17vw,86px);object-fit:contain;border-radius:8px}.hero .logo .wave{font-size:clamp(42px,12vw,64px)}
h1{font-size:clamp(20px,5vw,28px);margin:6px 0 2px;letter-spacing:.2px}
.subtitle{font-size:11px;color:#444}
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin:8px 0}
.inset{border:2px solid;border-color:#777 #fff #fff #777;background:#222;color:#ff3333;font-family:monospace;font-size:20px;font-weight:bold;padding:5px 8px;min-width:58px;text-align:center}
.face{font-size:25px;background:var(--win);border:2px solid;border-color:#fff #444 #444 #fff;width:44px;height:40px;cursor:pointer}
select,.btn{background:var(--win);border:2px solid;border-color:#fff #444 #444 #fff;padding:7px 9px;cursor:pointer}
.btn:active,.face:active{border-color:#444 #fff #fff #444}.btn.mode-active{background:#fff0b3;border-color:#444 #fff #fff #444;font-weight:bold}
.board-wrap{overflow:auto;padding:4px;background:#bdbdbd;border:3px solid;border-color:#777 #fff #fff #777;display:flex;justify-content:center}
.board{display:grid;gap:0;touch-action:manipulation;user-select:none}
.cell{width:clamp(25px,7.1vw,32px);height:clamp(25px,7.1vw,32px);max-width:32px;max-height:32px;padding:0;border:2px solid;border-color:#fff #777 #777 #fff;background:#c0c0c0;font-size:15px;font-weight:bold;display:flex;align-items:center;justify-content:center;cursor:pointer;touch-action:none;-webkit-user-select:none;user-select:none}
.cell.open{border:1px solid #888;background:#c0c0c0;cursor:default}
.cell.flag{color:#c00}
.cell.mine{background:#f2b8b8}
.n1{color:#0000ff}.n2{color:#008000}.n3{color:#f00}.n4{color:#000080}.n5{color:#800000}.n6{color:#008080}.n7{color:#111}.n8{color:#666}
.status{min-height:48px;display:flex;align-items:center;gap:10px;padding:10px;margin-top:10px;border:2px solid;border-color:#777 #fff #fff #777;background:#d4d0c8;font-size:13px}
.status .avatar{font-size:28px;flex-shrink:0}
.help{font-size:11px;line-height:1.8;color:#333;margin-top:10px}
.footer{font-size:10px;text-align:center;margin:12px 0 3px;color:#333}
.overlay{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;padding:18px}
.dialog{background:var(--win);border:2px solid;border-color:#fff #444 #444 #fff;width:min(100%,340px);padding:4px;box-shadow:4px 4px #111}
.dialog p{font-size:13px;line-height:1.8;padding:8px}
.dialog .btnrow{display:flex;justify-content:center;gap:8px;padding:8px}
@media(min-width:520px){.main{padding:16px}.cell{width:32px;height:32px}}
</style>
</head>
<body>
<div class="app" id="app">
 <div class="titlebar"><span>💣 <span id="windowTitle">تنگه هرمز — مین‌روب</span></span><small>v0.1</small></div>
 <div class="menubar"><button id="newGame">بازی جدید</button><button id="howBtn">راهنما</button><button id="langBtn">English</button></div>
 <div class="main">
  <div class="hero"><div class="logo" aria-label="شخصیت‌های بازی"><span class="wave" aria-hidden="true">🌊</span><img src="icons/pirate.png" alt="دزد دریایی بور با چشم‌بند پرچم آمریکا"><img src="icons/alarm.png" alt="ملوان هشداردهنده با پرچم ایران"></div><h1 id="gameTitle">تنگه هرمز</h1><div class="subtitle" id="subtitle">codabtin</div></div>
  <div class="toolbar">
   <div class="inset" id="mineCount">010</div>
   <button class="face" id="face" aria-label="شروع دوباره">🙂</button>
   <div class="inset" id="timer">000</div>
  </div>
  <div class="toolbar">
   <label for="difficulty" id="levelLabel">مرحله:</label>
   <select id="difficulty"><option value="easy">آسان 9×9</option><option value="medium">متوسط 12×12</option><option value="hard">سخت 16×16</option></select>
   <button class="btn" id="restart">شروع دوباره</button>
   <button class="btn" id="modeToggle" type="button" aria-pressed="false">حالت: مین‌زدایی</button>
  </div>
  <div class="board-wrap"><div class="board" id="board" role="grid" aria-label="صفحه مین‌روب"></div></div>
  <div class="status" aria-live="polite"><div class="avatar" id="statusAvatar">🧭</div><div id="statusText">یک خانه را باز کن، شاید مسیر تنگه هرمز به خلیج فارس امن باشد!</div></div>
  <div class="help" id="help">راهنما: روی خانه بزن تا باز شود. برای علامت‌گذاری مین، خانه را کمی طولانی لمس کن یا کلیک راست بزن. اعداد تعداد مین‌های اطراف را نشان می‌دهند.</div>
 </div>
</div>
<div class="overlay" id="overlay"><div class="dialog"><div class="titlebar" id="dialogTitle">راهنما</div><p id="dialogBody"></p><div class="btnrow"><button class="btn" id="closeDialog">باشه</button></div></div></div>
<script>
(() => {
const $=id=>document.getElementById(id);
let lang='fa', size=9, mines=10, cells=[], ended=false, startedAt=0, timerId=null, seconds=0, flags=0, opened=0, first=true, flagMode=false;
const presets={easy:{size:9,mines:10},medium:{size:12,mines:22},hard:{size:16,mines:40}};
const words={
 fa:{title:'تنگه هرمز',window:'تنگه هرمز — مین‌روب',subtitle:'codabtin',newGame:'بازی جدید',how:'راهنما',level:'مرحله:',easy:'آسان 9×9',medium:'متوسط 12×12',hard:'سخت 16×16',restart:'شروع دوباره',modeReveal:'حالت: مین‌زدایی',modeFlag:'حالت: پرچم‌گذاری',start:'یک خانه را باز کن، شاید مسیر تنگه هرمز به خلیج فارس امن باشد!',help:'راهنما: در حالت مین‌زدایی روی خانه بزن تا باز شود؛ با دکمهٔ حالت به پرچم‌گذاری برو و با زدن خانه‌ها پرچم بگذار یا بردار. اعداد تعداد مین‌های اطراف را نشان می‌دهند.',win:'پیروزی دریایی! ناخدا با چشم‌بند، مسیر را پیدا کرد! 🏴‍☠️',lose:'اوه نه! سخنگوی نظامی خبر بدی دارد؛ به مین برخورد کردی! 🎙️',howBody:'در حالت مین‌زدایی روی خانه بزن تا باز شود. دکمهٔ «حالت» را بزن تا به پرچم‌گذاری بروی؛ در آن حالت با ضربه روی خانه پرچم می‌گذاری یا برمی‌داری. دوباره دکمه را بزن تا به مین‌زدایی برگردی. اعداد تعداد مین‌های مجاور را نشان می‌دهند.',ok:'باشه',lost:'💥',won:'🏴‍☠️'},
 en:{title:'Strait of Hormuz',window:'Strait of Hormuz — Minesweeper',subtitle:'codabtin',newGame:'New Game',how:'How to play',level:'Level:',easy:'Easy 9×9',medium:'Medium 12×12',hard:'Hard 16×16',restart:'Restart',modeReveal:'Mode: Reveal',modeFlag:'Mode: Flag',start:'Open a tile—maybe the Strait of Hormuz route to the Persian Gulf is safe!',help:'How to play: In Reveal mode, tap a tile to open it. Switch to Flag mode to tap tiles and place/remove flags. Numbers show nearby mines.',win:'Nautical victory! The pirate captain found the route! 🏴‍☠️',lose:'Oh no! The military spokesperson has bad news—you hit a mine! 🎙️',howBody:'In Reveal mode, tap a tile to open it. Press the Mode button to switch to Flag mode, where tapping places or removes a flag. Press it again to return to Reveal mode. Numbers show adjacent mines.',ok:'OK',lost:'💥',won:'🏴‍☠️'}
};
function tr(k){return words[lang][k]}
function updateModeButton(){const b=$('modeToggle');b.textContent=tr(flagMode?'modeFlag':'modeReveal');b.classList.toggle('mode-active',flagMode);b.setAttribute('aria-pressed',String(flagMode));}
function setText(){ $('windowTitle').textContent=tr('window');$('gameTitle').textContent=tr('title');$('subtitle').textContent=tr('subtitle');$('newGame').textContent=tr('newGame');$('howBtn').textContent=tr('how');$('levelLabel').textContent=tr('level');$('restart').textContent=tr('restart');$('modeToggle').textContent=tr(flagMode?'modeFlag':'modeReveal');$('help').textContent=tr('help');$('langBtn').textContent=lang==='fa'?'English':'فارسی';$('difficulty').options[0].text=tr('easy');$('difficulty').options[1].text=tr('medium');$('difficulty').options[2].text=tr('hard');document.documentElement.lang=lang==='fa'?'fa':'en';document.documentElement.dir=lang==='fa'?'rtl':'ltr';if(!ended)$('statusText').textContent=tr('start');}
function newGame(){const p=presets[$('difficulty').value];size=p.size;mines=p.mines;cells=Array.from({length:size*size},()=>({mine:false,open:false,flag:false,n:0}));ended=false;first=true;flagMode=false;flags=0;opened=0;seconds=0;clearInterval(timerId);timerId=null;$('timer').textContent='000';$('face').textContent='🙂';$('statusAvatar').textContent='🧭';$('statusText').textContent=tr('start');placeBoard();updateCounter();updateModeButton();}
function placeBoard(){const b=$('board');b.innerHTML='';b.style.gridTemplateColumns=`repeat(${size}, minmax(0, 1fr))`;b.style.width='max-content';cells.forEach((c,i)=>{const el=document.createElement('button');el.className='cell';el.type='button';el.setAttribute('role','gridcell');el.setAttribute('aria-label',`tile ${i+1}`);el.dataset.i=i;let pressTimer=null, longPressed=false;el.addEventListener('click',e=>{if(longPressed){e.preventDefault();e.stopPropagation();longPressed=false;return}if(flagMode)toggleFlag(i);else reveal(i)});el.addEventListener('contextmenu',e=>{e.preventDefault();toggleFlag(i)});el.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'&&e.button!==0)return;longPressed=false;clearTimeout(pressTimer);pressTimer=setTimeout(()=>{longPressed=true;toggleFlag(i)},450)});const cancelPress=()=>{clearTimeout(pressTimer);pressTimer=null};el.addEventListener('pointerup',cancelPress);el.addEventListener('pointerleave',cancelPress);el.addEventListener('pointercancel',cancelPress);b.appendChild(el);});}
function neighbors(i){let r=Math.floor(i/size),c=i%size,a=[];for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){if(!dr&&!dc)continue;let nr=r+dr,nc=c+dc;if(nr>=0&&nr<size&&nc>=0&&nc<size)a.push(nr*size+nc)}return a}
function setupMines(safe){let placed=0;while(placed<mines){let i=Math.floor(Math.random()*cells.length);if(i===safe||neighbors(safe).includes(i)||cells[i].mine)continue;cells[i].mine=true;placed++}cells.forEach((c,i)=>c.n=neighbors(i).filter(j=>cells[j].mine).length);}
function startTimer(){if(timerId)return;startedAt=Date.now();timerId=setInterval(()=>{seconds=Math.min(999,Math.floor((Date.now()-startedAt)/1000));$('timer').textContent=String(seconds).padStart(3,'0')},250)}
function updateCounter(){$('mineCount').textContent=String(Math.max(0,mines-flags)).padStart(3,'0')}
function renderCell(i){let c=cells[i],el=$('board').children[i];el.className='cell';el.textContent='';if(c.flag){el.classList.add('flag');el.textContent='🚩'}if(c.open){el.classList.add('open');if(c.mine){el.classList.add('mine');el.textContent='💣'}else if(c.n){el.textContent=c.n;el.classList.add('n'+c.n)}}}
function toggleFlag(i){if(ended||cells[i].open)return;cells[i].flag=!cells[i].flag;flags+=cells[i].flag?1:-1;renderCell(i);updateCounter()}
function reveal(i){if(ended||cells[i].open||cells[i].flag)return;if(first){setupMines(i);first=false;startTimer()}const c=cells[i];c.open=true;opened++;renderCell(i);if(c.mine){finish(false);return}if(c.n===0)neighbors(i).forEach(j=>{if(!cells[j].open)revealSafe(j)});if(opened===cells.length-mines)finish(true)}
function revealSafe(i){if(ended||cells[i].open||cells[i].flag)return;cells[i].open=true;opened++;renderCell(i);if(cells[i].n===0)neighbors(i).forEach(j=>{if(!cells[j].open)revealSafe(j)});}
function finish(win){ended=true;clearInterval(timerId);timerId=null;$('face').textContent=win?'😎':'😵';$('statusAvatar').textContent=win?'🕴️🏴‍☠️':'🎙️💥';$('statusText').textContent=tr(win?'win':'lose');cells.forEach((c,i)=>{if(c.mine){c.open=true;renderCell(i)}});if(win){cells.forEach((c,i)=>{if(c.mine&&!c.flag){c.flag=true;renderCell(i)}});flags=mines;updateCounter()}}
$('newGame').addEventListener('click',newGame);$('restart').addEventListener('click',newGame);$('face').addEventListener('click',newGame);$('modeToggle').addEventListener('click',()=>{if(ended)return;flagMode=!flagMode;updateModeButton();$('statusText').textContent=tr(flagMode?'modeFlag':'start')});$('difficulty').addEventListener('change',newGame);
$('langBtn').addEventListener('click',()=>{lang=lang==='fa'?'en':'fa';setText();$('statusText').textContent=ended?$('statusText').textContent:tr('start')});
$('howBtn').addEventListener('click',()=>{$('dialogTitle').textContent=tr('how');$('dialogBody').textContent=tr('howBody');$('closeDialog').textContent=tr('ok');$('overlay').style.display='flex'});
$('closeDialog').addEventListener('click',()=>$('overlay').style.display='none');$('overlay').addEventListener('click',e=>{if(e.target===$('overlay'))$('overlay').style.display='none'});
setText();newGame();
})();
</script>
</body></html>
