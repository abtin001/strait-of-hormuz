<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#c0c0c0">
<title>تنگه هرمز | Strait of Hormuz</title>
<style>
:root{--win:#c0c0c0;--navy:#000080;--panel:#dfdfdf;--ink:#111;--green:#008000;--red:#b00020}
*{box-sizing:border-box}
body{margin:0;background:#008080;color:var(--ink);font-family:Tahoma,"MS Sans Serif",Arial,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:14px}
button,select{font:inherit;color:#111}
.app{width:min(100%,560px);background:var(--win);border:2px solid;border-color:#fff #404040 #404040 #fff;box-shadow:2px 2px 0 #111;padding:3px}
.titlebar{background:linear-gradient(90deg,#000080,#1084d0);color:#fff;padding:7px 9px;display:flex;align-items:center;justify-content:space-between;font-weight:bold;font-size:14px}
.titlebar small{font-weight:normal;font-size:11px}
.menubar{display:flex;gap:16px;padding:7px 8px;border-bottom:1px solid #888;font-size:12px}
.menubar button{background:none;border:0;padding:0;text-decoration:underline;cursor:pointer}
.main{padding:12px}
.hero{text-align:center;padding:7px 0 10px}
.hero .logo{font-size:36px;line-height:1.1;display:flex;align-items:center;justify-content:center;gap:12px}.hero .logo img{width:clamp(54px,17vw,86px);height:clamp(54px,17vw,86px);object-fit:contain;border-radius:8px}.hero .logo .wave{font-size:clamp(42px,12vw,64px)}
h1{font-size:clamp(20px,5vw,28px);margin:6px 0 2px;letter-spacing:.2px}
.subtitle{font-size:11px;color:#444}
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin:8px 0}
.inset{border:2px solid;border-color:#777 #fff #fff #777;background:#222;color:#ff3333;font-family:monospace;font-size:20px;font-weight:bold;padding:5px 8px;min-width:58px;text-align:center}
.face{font-size:25px;background:var(--win);border:2px solid;border-color:#fff #444 #444 #fff;width:44px;height:40px;cursor:pointer}
select,.btn{background:var(--win);border:2px solid;border-color:#fff #444 #444 #fff;padding:7px 9px;cursor:pointer}
.btn:active,.face:active{border-color:#444 #fff #fff #444}.btn.mode-active{background:#fff0b3;border-color:#444 #fff #fff #444;font-weight:bold}
.board-wrap{overflow:auto;padding:4px;background:#bdbdbd;border:3px solid;border-color:#777 #fff #fff #777;display:flex;justify-content:center}
.board{display:grid;gap:0;touch-action:manipulation;user-select:none}
.cell{width:clamp(25px,7.1vw,32px);height:clamp(25px,7.1vw,32px);max-width:32px;max-height:32px;padding:0;border:2px solid;border-color:#fff #777 #777 #fff;background:#c0c0c0;font-size:15px;font-weight:bold;display:flex;align-items:center;justify-content:center;cursor:pointer;touch-action:none;-webkit-user-select:none;user-select:none}
.cell.open{border:1px solid #888;background:#c0c0c0;cursor:default}
.cell.flag{color:#c00}
.cell.mine{background:#f2b8b8}
.n1{color:#0000ff}.n2{color:#008000}.n3{color:#f00}.n4{color:#000080}.n5{color:#800000}.n6{color:#008080}.n7{color:#111}.n8{color:#666}
.status{min-height:48px;display:flex;align-items:center;gap:10px;padding:10px;margin-top:10px;border:2px solid;border-color:#777 #fff #fff #777;background:#d4d0c8;font-size:13px}
.status .avatar{font-size:28px;flex-shrink:0}
.help{font-size:11px;line-height:1.8;color:#333;margin-top:10px}
.footer{font-size:10px;text-align:center;margin:12px 0 3px;color:#333}
.overlay{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;padding:18px}
.dialog{background:var(--win);border:2px solid;border-color:#fff #444 #444 #fff;width:min(100%,340px);padding:4px;box-shadow:4px 4px #111}
.dialog p{font-size:13px;line-height:1.8;padding:8px}
.dialog .btnrow{display:flex;justify-content:center;gap:8px;padding:8px}
@media(min-width:520px){.main{padding:16px}.cell{width:32px;height:32px}}
</style>
</head>

function toggleFlag(i){if(ended||cells[i].open)return;cells[i].flag=!cells[i].flag;flags+=cells[i].flag?1:-1;renderCell(i);updateCounter()}
function reveal(i){if(ended||cells[i].open||cells[i].flag)return;if(first){setupMines(i);first=false;startTimer()}const c=cells[i];c.open=true;opened++;renderCell(i);if(c.mine){finish(false);return}if(c.n===0)neighbors(i).forEach(j=>{if(!cells[j].open)revealSafe(j)});if(opened===cells.length-mines)finish(true)}
function revealSafe(i){if(ended||cells[i].open||cells[i].flag)return;cells[i].open=true;opened++;renderCell(i);if(cells[i].n===0)neighbors(i).forEach(j=>{if(!cells[j].open)revealSafe(j)});}
function finish(win){ended=true;clearInterval(timerId);timerId=null;$('face').textContent=win?'😎':'😵';$('statusAvatar').textContent=win?'🕴️🏴‍☠️':'🎙️💥';$('statusText').textContent=tr(win?'win':'lose');cells.forEach((c,i)=>{if(c.mine){c.open=true;renderCell(i)}});if(win){cells.forEach((c,i)=>{if(c.mine&&!c.flag){c.flag=true;renderCell(i)}});flags=mines;updateCounter()}}
$('newGame').addEventListener('click',newGame);$('restart').addEventListener('click',newGame);$('face').addEventListener('click',newGame);$('modeToggle').addEventListener('click',()=>{if(ended)return;flagMode=!flagMode;updateModeButton();$('statusText').textContent=tr(flagMode?'modeFlag':'start')});$('difficulty').addEventListener('change',newGame);
$('langBtn').addEventListener('click',()=>{lang=lang==='fa'?'en':'fa';setText();$('statusText').textContent=ended?$('statusText').textContent:tr('start')});
$('howBtn').addEventListener('click',()=>{$('dialogTitle').textContent=tr('how');$('dialogBody').textContent=tr('howBody');$('closeDialog').textContent=tr('ok');$('overlay').style.display='flex'});
$('closeDialog').addEventListener('click',()=>$('overlay').style.display='none');$('overlay').addEventListener('click',e=>{if(e.target===$('overlay'))$('overlay').style.display='none'});
setText();newGame();
})();
</script>
